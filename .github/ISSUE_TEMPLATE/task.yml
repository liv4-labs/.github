name: Task
description: Lavoro di sviluppo pianificabile
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Priorità, taglia, area, cliente, ambiente e sprint **non si scrivono qui**: sono campi del Project
        [LIV4 delivery](https://github.com/orgs/liv4-labs/projects/7) e si impostano alla backlog prioritization, al refinement e quando la issue entra in uno sprint.
        Su un Bug, `Ambiente` si compila all'apertura e dice se il difetto è già in mano ai clienti, non dove lo hai visto.
        Qui va solo ciò che si legge aprendo la issue.

        Le issue del Project si aprono tutte su **quality-engine**, anche quando il lavoro tocca il portale o l'infrastruttura: dove si lavora lo dice il campo Area.

        **Il titolo è un nome corto**, poche parole su un sostantivo: «Import dell'8D da Excel», non «Compilare l'8D dall'Excel che manda il fornitore». La spiegazione sta nel corpo. Su un bug il nome è il sintomo in poche parole.

        Il corpo dice tre cose, comprensibili senza aver letto il documento da cui la issue nasce:
        **com'è oggi**, **cosa deve diventare vero**, **come si sa che è finita**.
        Ogni cosa si scrive una volta sola, e le sezioni facoltative senza contenuto si tolgono.

        **A Backlog la issue è corta.** «Com'è oggi» sono due o tre frasi sul problema. Criteri, outcome e passi portano la nota «si compila al passaggio in Ready», e «Specifiche tecniche» resta vuota. File, funzioni, conteggi e stato dei rami si raccolgono al refinement, verificati sulla fonte viva.

  - type: textarea
    id: da-leggere
    attributes:
      label: Da leggere prima
      description: |
        Solo se la issue ha una milestone: il link alla milestone, e poi le issue vicine, una per riga, con il nome e il perché leggerla («tocca lo stesso form»). Vicine sono le issue della stessa milestone che toccano lo stesso pezzo di prodotto (stesso agente, stessa schermata, stessi dati) e quelle da cui questa dipende. Chi sviluppa con un agente gli passa il corpo, e il campo Milestone l'agente non lo vede. Senza milestone la sezione si toglie.
      placeholder: "- Milestone: https://github.com/liv4-labs/quality-engine/milestone/3
- #1072, indirizzi del gestionale dall'attivazione: scrive la stessa configurazione"
    validations:
      required: false

  - type: textarea
    id: oggi
    attributes:
      label: Com'è oggi
      description: |
        Lo stato di partenza, scritto per chi non c'era: prima il sintomo come lo vede l'utente, poi perché succede, in italiano corrente. Verificato sulla fonte viva (codice sul ramo di lavoro, database, infrastruttura) e non su un documento di analisi: un'analisi di un giorno prima può essere già smentita. Se la verifica non è possibile, si dichiara invece di tirare a indovinare.

        I riferimenti arrivano al file e alla funzione: repo, ramo, file, tabella, rotta, nome del servizio. «Il portale» o «il server» non bastano. SHA, numeri di riga, id dei messaggi e storia della segnalazione restano fuori, e l'analisi dettagliata del codice va in «Specifiche tecniche». A Backlog questi riferimenti non servono ancora: arrivano al refinement.

        Ogni fatto osservato porta la data e il modo in cui è stato visto: «verificato il 24/9/2026 su develop di quality-engine», o il comando che lo rifà. Non portano data le cose che non sono osservazioni: il risultato atteso, il perimetro, un criterio.

        Su un bug è la sezione che serve di più: il sintomo osservato, con i numeri e la build su cui è stato visto.
      placeholder: "L'ETL scarta i record cancellati alla fonte: l'importatore filtra su deleted_at (liv4-labs/lambda-stream-etl, etl/extract.py, develop). Verificato il 17/09/2026."
    validations:
      required: true

  - type: textarea
    id: risultato
    attributes:
      label: Risultato atteso
      description: Il comportamento finale, descritto in modo che si possa immaginare. Chi fa cosa, e cosa vede dopo. Una riga che sembra un titolo non basta. Se la issue consegna qualcosa a una persona, nomina la schermata e cosa ci vede chi la usa. Scrivere «sviluppare backend e frontend» non basta.
      placeholder: L'ETL importa anche i record cancellati alla fonte. Chi apre il portale li trova con lo stato che hanno nel gestionale, invece di non trovarli affatto.
    validations:
      required: true

  - type: textarea
    id: perche
    attributes:
      label: Perché conta
      description: Chi ne beneficia e cosa succede se non si fa. Non ripete «Com'è oggi».
    validations:
      required: true

  - type: textarea
    id: incluso
    attributes:
      label: Incluso
      description: Cosa rientra nello scope, in due blocchi, Backend e Portale, se la issue consegna qualcosa a una persona. Se non mostra niente a nessuno, lo scrive qui.
      placeholder: |
        **Backend**
        - ...

        **Portale**
        - ...
    validations:
      required: true

  - type: textarea
    id: escluso
    attributes:
      label: Escluso
      description: Cosa NON rientra, anche se qualcuno potrebbe aspettarselo. Serve a chiudere senza discussioni. Un rimando a un'altra issue vale solo se quella lo ha nel suo Incluso.
    validations:
      required: true

  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
      description: |
        Due elenchi, scritti dal PM quando la issue passa da Backlog a Ready o in Todo: una issue senza criteri non entra in uno sprint. I **Bloccanti** vengono per primi e decidono l'accettazione. Il primo è già scritto: dice che la cosa ha senso per chi la usa, e si riempiono i buchi fra parentesi quadre. Se non si sanno riempire, la issue non è pronta. I **Desiderabili** non fermano la issue: se ne manca uno, diventa una issue nuova a Backlog. Se non ce ne sono, si toglie l'elenco: niente elenco vuoto, niente «nessuno». I Bloccanti restano obbligatori, da tre a sei.

        Come checklist, così l'avanzamento si vede dalla lista senza aprire la issue. Non è la Definition of Done, che sta nel README del Project e vale per tutti.
      value: |
        **Bloccanti**
        - [ ] Ha senso per chi la usa: [chi], arrivando da [dove], la usa per [capire o decidere cosa]. Quello che vede risponde a quello, con dati che si ritrovano nella fonte, senza testo tecnico, vuoti, valori inventati o valori presi da un'altra cosa e quindi sbagliati.
        - [ ] 

        **Desiderabili**
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome verificabile
      description: Dove e come si prova che il risultato atteso è raggiunto, senza ripetere i criteri.
    validations:
      required: true

  - type: textarea
    id: passi
    attributes:
      label: Passi
      description: I passi interni al lavoro, come checklist, senza ripetere «Incluso». Se non aggiungono niente, la sezione si toglie.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: false

  - type: textarea
    id: specifiche
    attributes:
      label: Specifiche tecniche
      description: Si lascia vuota all'apertura, e a Backlog la issue non la compila. Si compila nello stato Design, prima di iniziare a scrivere codice. Qui va l'analisi dettagliata del codice, che «Com'è oggi» non riporta.
    validations:
      required: false

  - type: textarea
    id: rischi
    attributes:
      label: Rischi
      description: |
        Si parte da una riga: una frase che nomina il rischio. Diventa un blocco strutturato solo se sai rispondere a tre domande: chi lo presidia, entro quando, cosa si fa se scade. Se non sai rispondere, la riga era già la cosa giusta.

        Un rischio che poggia su un fatto osservato porta la data e il modo in cui è stato visto, come in «Com'è oggi».

        Esempio di blocco:
        | | |
        |---|---|
        | Descrizione | Serve una persona per lo sblocco infrastruttura |
        | Impatto | Ambiente UAT |
        | Azione | Sentirla. A scadenza, fallback su test manuali |
        | Data limite | 5 agosto |
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        *Allineato al processo del 28/10/2026.*
